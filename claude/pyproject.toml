[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmsim"
version = "0.1.0"
description = "A liquid portfolio in base currency funding USD private-market commitments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["pmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
