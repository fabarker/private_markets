[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-markets-simulation"
version = "0.1.0"
description = "Dated liquid/private portfolio simulation with commitment percentage carryforward"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["vintage", "simulation", "simulation_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

